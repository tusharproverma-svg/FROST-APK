name: Build FROST APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android लाइसेंस स्वीकार करो
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "ANDROID_HOME=$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unzip source
        run: |
          unzip -o frost-android-src.zip -d src
          D=$(dirname "$(find src -name settings.gradle | head -1)")
          echo "PROJ=$D" >> $GITHUB_ENV
          echo "प्रोजेक्ट: $D"
      - name: Build
        run: cd "$PROJ" && gradle assembleDebug --no-daemon --stacktrace
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$(find "$PROJ" -name app-debug.apk | head -1)" FROST.apk
          gh release create v${{ github.run_number }} FROST.apk --title "FROST APK v${{ github.run_number }}" --notes "डाउनलोड करके इंस्टॉल कीजिए"
          
